[project]
name = "vesper"
version = "0.1.1"
description = "The CUDA accelerated version of VESPER"
readme = "README.md"
authors = [
    { name = "Han Zhu", email = "zhu773@purdue.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.88",
    "gemmi>=0.5.6",
    "mrcfile>=1.5",
    "numba>=0.60",
    "numpy",
    "pydssp>=0.9.0",
    "pyfftw>=0.15",
    "scipy>=1.15",
    "torch",
    "tqdm>=4.66",
    "typer>=0.20.0",
]

[project.scripts]
vesper = "vesper.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.2.22",
    "ruff>=0.14.9",
    "ty>=0.0.3",
]
